name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 校验配置模板
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyYAML
        run: python -m pip install --quiet --disable-pip-version-check "pyyaml>=6"

      - name: 校验问题定义 + 三份模板 + 副本一致性
        run: python recurring-intel-search/scripts/validate_config.py --all .

      - name: 文档与代码一致性（枚举/计数/id 覆盖）
        run: python recurring-intel-search/scripts/check_consistency.py .

      - name: 字节码编译脚本
        run: python -m compileall -q recurring-intel-search/scripts

      - name: 插件冒烟测试（输出 schema + 条件题 + 校验路径）
        run: |
          npm --prefix dsh-native-intel-search install --no-audit --no-fund --silent
          node dsh-native-intel-search/scripts/smoke.mjs

      - name: 访谈集成测试（A/B/C 三条路径 + JS→Python 交叉校验）
        run: |
          node dsh-native-intel-search/scripts/interview.mjs
          for f in .interview-out/*.yaml; do
            echo "::group::$f"
            python recurring-intel-search/scripts/validate_config.py "$f"
            echo "::endgroup::"
          done
